<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Copier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" width="24" height="24" alt="">
    <h1>Company Copier</h1>
  </header>

  <section id="now" class="now" data-s="idle" role="status" aria-live="polite">
    <span class="pulse" aria-hidden="true"></span>
    <div><strong id="nowTitle">Ready</strong><span id="nowMsg"></span></div>
  </section>

  <section class="budget">
    <p class="big"><span id="count">0</span><span class="of"> of 10 pages today</span></p>
    <div id="segs" class="segs" role="img" aria-label="0 of 10 pages used today"></div>
    <p class="sub"><span id="saved">0 companies saved</span><span>Resets at midnight</span></p>
  </section>

  <button id="main" class="primary" type="button">Start copying</button>
  <p id="hint" class="hint" role="status"></p>
  <div class="row">
    <button id="resume" class="link" type="button">Resume last page</button>
    <button id="scrape" class="link" type="button">Copy this page only</button>
  </div>

  <button id="open" class="workspace" type="button">Open workspace</button>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
